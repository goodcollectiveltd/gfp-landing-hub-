# Netlify build + hosting config for the GFP Landing Hub.
#
# Vite builds a single-page app: React Router handles routes like /p/8-reasons
# in the browser, but the server must serve index.html for those paths (a direct
# hit or refresh would otherwise 404). The SPA fallback below does that.

[build]
  command = "npm run build"
  publish = "dist"

# Bare subdomain root → the main store. This is a public ad subdomain, so nobody
# should land on its root; force = true makes it win over the SPA index.html so
# the redirect happens at the edge with no app load. Matches "/" exactly, so
# /p/* and /admin fall through to the SPA rule below.
[[redirects]]
  from = "/"
  to = "https://goodforpets.co"
  status = 302
  force = true

# The bare *.netlify.app alias served the exact same pages as hello.goodforpets.co with
# no canonical — two hosts, one set of content, classic duplicate content. Send it to the
# real subdomain so there is only ever one address for these pages.
[[redirects]]
  from = "https://gfp-landing-hub.netlify.app/*"
  to = "https://hello.goodforpets.co/:splat"
  status = 301
  force = true

# SEO: paid ad landing pages must not compete with goodforpets.co in organic search.
# Crawling stays allowed (see public/robots.txt) so this header is actually seen.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Old routes → the live page. 10→8 was the rename; 8-reasons-v2 was the review
# draft that's now been promoted to /p/8-reasons. Keep both alive so stray links land.
[[redirects]]
  from = "/p/10-reasons"
  to = "/p/8-reasons"
  status = 301
  force = true

[[redirects]]
  from = "/p/8-reasons-v2"
  to = "/p/8-reasons"
  status = 301
  force = true

# Serve index.html for any path the CDN can't match to a real file, so deep links
# (e.g. an ad landing on /p/8-reasons) load the app instead of 404ing. Real assets
# under /assets/* are matched first, so this only catches app routes.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
